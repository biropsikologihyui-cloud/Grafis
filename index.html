<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Menggambar & Monitoring Kamera</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .panel {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        canvas, video {
            border: 2px solid #ccc;
            background-color: #fff;
            border-radius: 8px;
            width: 400px;
            height: 300px;
        }
        canvas { cursor: crosshair; }
        .toolbar {
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
            align-items: center;
            background: #fff;
            padding: 10px 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 840px;
            box-sizing: border-box;
            justify-content: center;
        }
        .btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 8px 15px;
            font-size: 14px;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-clear { background-color: #f44336; }
        .btn-send { background-color: #008CBA; }
        .btn:hover { opacity: 0.9; }
        #status { margin-top: 10px; font-weight: bold; color: #333; }
    </style>
</head>
<body>

    <h2>Aplikasi Menggambar & Monitoring Kamera</h2>
    
    <div class="toolbar">
        <label>Warna: <input type="color" id="colorPicker" value="#000000"></label>
        <label>Ukuran: <input type="range" id="brushSize" min="1" max="20" value="5"></label>
        <button class="btn btn-clear" id="clearBtn">Bersihkan Kanvas</button>
        <button class="btn btn-send" id="sendAllBtn">Kirim Gambar ke Email & Drive</button>
    </div>

    <div class="container">
        <!-- Panel Menggambar -->
        <div class="panel">
            <h3>Area Gambar</h3>
            <canvas id="drawingCanvas" width="400" height="300"></canvas>
        </div>

        <!-- Panel Monitoring Kamera -->
        <div class="panel">
            <h3>Monitoring Kamera</h3>
            <video id="webcam" autoplay playsinline></video>
            <button class="btn" style="margin-top: 10px;" id="snapBtn">Ambil Foto Kamera</button>
        </div>
    </div>

    <p id="status"></p>

    <!-- Canvas tersembunyi untuk mengambil frame foto kamera -->
    <canvas id="snapshotCanvas" width="400" height="300" style="display:none;"></canvas>

    <script>
        // --- KONFIGURASI GOOGLE APPS SCRIPT WEB APP URL ---
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzENqmvxmj6kc1NW1pkzCWh9WJ_CEFAADqr2AI-Z5mifCGmTtuTvUTYWq_Xk-9iCYQTVQ/exec";

        // --- SETUP KANVAS GAMBAR ---
        const canvas = document.getElementById('drawingCanvas');
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        let isDrawing = false;
        canvas.addEventListener('mousedown', (e) => { isDrawing = true; draw(e); });
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', () => { isDrawing = false; ctx.beginPath(); });

        function draw(e) {
            if (!isDrawing && e.type !== 'mousedown') return;
            const rect = canvas.getBoundingClientRect();
            ctx.strokeStyle = document.getElementById('colorPicker').value;
            ctx.lineWidth = document.getElementById('brushSize').value;
            ctx.lineCap = 'round';
            
            const x = (e.clientX || e.touches?.[0].clientX) - rect.left;
            const y = (e.clientY || e.touches?.[0].clientY) - rect.top;

            if (e.type === 'mousedown') {
                ctx.beginPath();
                ctx.moveTo(x, y);
            } else {
                ctx.lineTo(x, y);
                ctx.stroke();
            }
        }

        document.getElementById('clearBtn').addEventListener('click', () => {
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        });

        // --- SETUP WEBCAM ---
        const video = document.getElementById('webcam');
        navigator.mediaDevices.getUserMedia({ video: true })
            .then(stream => { video.srcObject = stream; })
            .catch(err => { console.warn("Kamera tidak diizinkan / tidak tersedia: ", err); });

        // --- FUNGSI KIRIM KE GOOGLE DRIVE (VIA APPS SCRIPT) ---
        async function uploadToGoogleDrive(dataURL, filename) {
            document.getElementById('status').innerText = "Mengunggah gambar ke Google Drive...";
            try {
                let response = await fetch(WEB_APP_URL, {
                    method: "POST",
                    mode: "no-cors", // Diperlukan untuk Apps Script Web App sederhana
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ file: dataURL, filename: filename })
                });
                return true;
            } catch (error) {
                console.error("Gagal unggah:", error);
                return false;
            }
        }

        // --- TOMBOL KIRIM UTAMA ---
        document.getElementById('sendAllBtn').addEventListener('click', async () => {
            const statusText = document.getElementById('status');
            statusText.innerText = "Memproses pengiriman...";

            // 1. Ambil data gambar hasil coretan
            const drawingDataURL = canvas.toDataURL('image/png');
            await uploadToGoogleDrive(drawingDataURL, "hasil_gambar_psikologi.png");

            // 2. Ambil data foto dari kamera (jika kamera aktif)
            const snapCanvas = document.getElementById('snapshotCanvas');
            const snapCtx = snapCanvas.getContext('2d');
            snapCtx.drawImage(video, 0, 0, snapCanvas.width, snapCanvas.height);
            const cameraDataURL = snapCanvas.toDataURL('image/png');
            await uploadToGoogleDrive(cameraDataURL, "monitoring_kamera.png");

            statusText.innerText = "Selesai! File berhasil masuk ke Google Drive. Membuka klien email...";

            // 3. Otomatis buka email ke biropsikologihyui@gmail.com
            // (Catatan: Unduh file lokal juga sebagai cadangan untuk dilampirkan manual ke email jika diperlukan)
            const link = document.createElement('a');
            link.download = 'hasil_gambar_psikologi.png';
            link.href = drawingDataURL;
            link.click();

            setTimeout(() => {
                const emailTujuan = "biropsikologihyui@gmail.com";
                const subjek = encodeURIComponent("Hasil Tes Gambar & Monitoring Online");
                const body = encodeURIComponent("Halo Biro Psikologi HYUI,\n\nBerikut terlampir hasil gambar tes online saya. Foto monitoring kamera dan hasil gambar juga telah otomatis terunggah ke Google Drive.\n\nTerima kasih.");
                window.location.href = `mailto:${emailTujuan}?subject=${subjek}&body=${body}`;
            }, 1000);
        });
    </script>
</body>
</html>
